name: Daily Contribution

on:
  schedule:
    - cron: '0 12 * * 1-5'
  workflow_dispatch:

jobs:
  contribute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make contribution
        run: |
          git config user.name "0x0Abdullah"
          git config user.email "abdullahhere0812@gmail.com"
          echo "// Contribution on $(date +%Y-%m-%d)" >> Project-1.cpp
          git add .
          git commit -m "Daily contribution $(date +%Y-%m-%d)" || exit 0
          git push
